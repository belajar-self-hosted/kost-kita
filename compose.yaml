services:
    db:
        image: postgres:16-alpine
        container_name: kostkita_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-kostkita}
            POSTGRES_USER: ${POSTGRES_USER:-kostkita_admin}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided}
        volumes:
            - kostkita_pgdata:/var/lib/postgresql/data
        networks:
            - private-data
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 5s

    app:
        image: kostkita-app:${KOSTKITA_IMAGE_TAG:-local}
        build:
            context: .
            target: app
            args:
                KOSTKITA_RELEASE_SHA: ${KOSTKITA_RELEASE_SHA:-unknown}
        container_name: kostkita_app
        restart: unless-stopped
        user: www-data
        env_file:
            - ${KOSTKITA_ENV_FILE:-../.env}
        volumes:
            - kostkita_storage:/var/www/html/storage
        networks:
            - private-data
            - app-network
        depends_on:
            db:
                condition: service_healthy

    web:
        image: kostkita-web:${KOSTKITA_IMAGE_TAG:-local}
        build:
            context: .
            target: web
            args:
                KOSTKITA_RELEASE_SHA: ${KOSTKITA_RELEASE_SHA:-unknown}
        container_name: kostkita_web
        restart: unless-stopped
        ports:
            - '${APP_BIND_IP:-192.168.0.26}:${APP_HTTP_PORT:-8080}:80'
        networks:
            - app-network
        depends_on:
            - app

    scheduler:
        image: kostkita-app:${KOSTKITA_IMAGE_TAG:-local}
        container_name: kostkita_scheduler
        restart: unless-stopped
        user: www-data
        command: ['php', 'artisan', 'schedule:work']
        env_file:
            - ${KOSTKITA_ENV_FILE:-../.env}
        volumes:
            - kostkita_storage:/var/www/html/storage
        networks:
            - private-data
            - app-network
        depends_on:
            db:
                condition: service_healthy
            app:
                condition: service_started

networks:
    private-data:
        driver: bridge
        internal: true
    app-network:
        driver: bridge

volumes:
    kostkita_pgdata:
        name: kostkita_pgdata
    kostkita_storage:
        name: kostkita_storage
