name: Local In-LXC CI/CD Deployment

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

# Keep deployment runs serialized without replacing pending runs. Stale-SHA
# runs fail their current-main check when they reach the front of the queue.
concurrency:
  group: kostkita-production-deploy
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.workflow_id == 405373892 &&
      github.event.workflow_run.name == 'tests' &&
      vars.KOSTKITA_DEPLOYMENT_ENABLED == 'true'
    name: Build and deploy on the designated LXC runner
    runs-on: [self-hosted, linux, x64, kostkita]
    # Configure required reviewers and restrict this environment to main in
    # GitHub Settings before setting KOSTKITA_DEPLOYMENT_ENABLED=true.
    environment: production
    timeout-minutes: 120
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      KOSTKITA_EXPECTED_HOSTNAME: ${{ vars.KOSTKITA_EXPECTED_HOSTNAME }}
      KOSTKITA_MIN_FREE_DISK_BYTES: ${{ vars.KOSTKITA_MIN_FREE_DISK_BYTES }}
      KOSTKITA_MIN_FREE_INODES: ${{ vars.KOSTKITA_MIN_FREE_INODES }}

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          persist-credentials: false

      - name: Checkout current main for stale-run check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: current-main
          persist-credentials: false

      - name: Verify exact tested SHA is current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C current-main rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Build, verify, and activate release
        working-directory: candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/deploy/deploy.sh "$CANDIDATE_SHA" /opt/kostkita/.env
